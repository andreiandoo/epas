# Builds viaqui.com on every push to `core` that touches the marketplace folder.
#
# Same build as deploy-bilete.yml (Tailwind + minified JS/CSS), committed to the `viaqui` branch with the site under
# public/ (the web directory of the Ploi site). Ploi deploys that branch itself: connect the repository in Ploi with
# branch `viaqui` and enable Quick deploy. Nothing here calls the server.
#
# Skip a build with [skip ci] in the commit message. GitHub reads the whole message, body included.
name: Deploy viaqui.com

on:
  push:
    branches: [core]
    paths:
      - 'resources/marketplaces/viaqui/**'
      - '.github/workflows/deploy-viaqui.yml'
  workflow_dispatch:

concurrency:
  group: deploy-viaqui
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: github.repository == 'andreiandoo/epas'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the marketplace folder from core
        uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: resources/marketplaces/viaqui

      - name: Check out the viaqui branch (created on the first run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch viaqui "$remote" site; then
            rm -rf site && mkdir site && cd site
            git init -q -b viaqui
            git remote add origin "$remote"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the build tools (same versions as deploy-bilete.yml)
        run: npm install -g tailwindcss@3.2.4 terser@5.46.0 clean-css-cli@5.6.3 esbuild@0.24.0

      - name: Replace the site files
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir site/public
          cp -a src/resources/marketplaces/viaqui/. site/public/
          # bilete.online working files that came with the copy and are of no use on the server
          rm -rf site/public/designs site/public/csvs site/public/PLAN-GYG.md
          printf '%s\n' '# viaqui.com' '' 'Built by .github/workflows/deploy-viaqui.yml from resources/marketplaces/viaqui on branch core.' 'Do not edit here: every build replaces this branch. The web directory is public/.' > site/README.md

      - name: Build Tailwind
        working-directory: site/public
        run: |
          mkdir -p assets/css/bundles
          for b in home event listing single checkout auth account organizer static error; do
            if [ -f "assets/css/build/tailwind.$b.cjs" ]; then
              tailwindcss -c "assets/css/build/tailwind.$b.cjs" -i "assets/css/build/input-$b.css" -o "assets/css/bundles/$b.css" --minify \
                || echo "::warning::Tailwind bundle $b failed"
            fi
          done
          tailwindcss -c tailwind.config.cjs -i assets/css/tailwind-input.css -o assets/css/tailwind.min.css --minify

      - name: Minify JS and CSS
        working-directory: site/public
        run: |
          find assets/js -name '*.js' -print0 | while IFS= read -r -d '' f; do
            if terser "$f" --compress --mangle -o "$f.tmp"; then mv "$f.tmp" "$f"; else rm -f "$f.tmp"; echo "::warning::terser failed on $f"; fi
          done
          cleancss -o assets/css/custom.css.tmp assets/css/custom.css && mv assets/css/custom.css.tmp assets/css/custom.css
          cat assets/css/custom.css assets/css/tailwind.min.css > assets/css/styles.css
          # The v2 pages: their own scripts (the libraries under vendor/ are minified already) and stylesheets.
          # esbuild for the stylesheets: clean-css does not know the newer CSS they use. A file that fails stays as it is.
          find assets/v2/js -maxdepth 1 -name '*.js' -print0 | while IFS= read -r -d '' f; do
            if terser "$f" --compress --mangle -o "$f.tmp"; then mv "$f.tmp" "$f"; else rm -f "$f.tmp"; echo "::warning::terser failed on $f"; fi
          done
          find assets/v2/css -name '*.css' -print0 | while IFS= read -r -d '' f; do
            if esbuild "$f" --minify --log-level=error --outfile="$f.tmp" && [ -s "$f.tmp" ]; then mv "$f.tmp" "$f"; else rm -f "$f.tmp"; echo "::warning::esbuild failed on $f"; fi
          done

      - name: Stamp this build
        working-directory: site/public
        run: |
          date -u '+%Y-%m-%d %H:%M:%S' > .deploy-timestamp
          echo "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > deploy-version.txt

      - name: Push to the viaqui branch
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          subject="$(git -C ../src log -1 --format=%s | head -c 120)"
          git commit -q -m "Deploy viaqui ${GITHUB_SHA::9}: ${subject}"
          git push origin HEAD:viaqui
