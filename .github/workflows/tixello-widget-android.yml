name: Tixello Widget (Android APK)

# Containerul de dezvoltare nu are Android SDK (dl.google.com e blocat de
# proxy), deci APK-ul se construieste aici. Rezultatul se descarca din
# Actions → rularea respectiva → Artifacts → tixello-widget-apk.
on:
  push:
    paths:
      - 'tixello-widget-android/**'
      - '.github/workflows/tixello-widget-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tixello-widget-android

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Teste (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK de debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Incarca APK-ul
        uses: actions/upload-artifact@v4
        with:
          name: tixello-widget-apk
          path: tixello-widget-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 60

      - name: Incarca raportul de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tixello-widget-test-report
          path: tixello-widget-android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
