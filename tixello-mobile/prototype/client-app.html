      <div class="between pad" style="position:relative;padding-top:4px"><div class="icon-btn glass" data-a="back">${I.back}</div><div class="icon-btn glass">${I.save}</div></div>
      <div style="position:absolute;left:20px;right:20px;bottom:18px"><span class="badge" style="background:rgba(255,255,255,.16);color:#fff">Festival · 4 zile</span><div style="font-size:23px;font-weight:800;margin-top:8px">${FEST.t}</div><div style="font-size:12.5px;opacity:.8;margin-top:2px">${FEST.d} · Wonderland, Cluj</div></div></div>
    <div class="pad" style="margin-top:16px"><div class="card" data-a="tab:wallet" style="cursor:pointer;background:linear-gradient(135deg,var(--indigo-3),#2a1065);border:1px solid var(--line-2);color:#fff;padding:15px 16px;display:flex;align-items:center;gap:13px"><div style="width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center">${I.wallet}</div><div style="flex:1"><div style="font-weight:800;font-size:14px">Portofel cashless</div><div style="font-size:11.5px;opacity:.82">Sold ${lei(ST.balance)} lei · plătește cu brățara</div></div>${I.arrow}</div>
      <div class="scroll-x" style="margin-top:16px;padding:0">${FEST.days.map((d,i)=>`<button class="chip ${i===0?'ind on':''}">${d}</button>`).join('')}</div>
      <div class="h2" style="margin-top:18px;font-size:15px">Lineup — Joi 10</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:11px">${FEST.lineup.map((l,i)=>`<div class="listitem"><div style="width:46px;height:46px;border-radius:14px;background:${['linear-gradient(135deg,#7c3aed,#2a1065)','linear-gradient(135deg,#8b5cf6,#241a44)','linear-gradient(135deg,#a78bfa,#6d28d9)'][i%3]};display:grid;place-items:center;font-size:18px">🎧</div><div style="flex:1"><div style="font-weight:800;font-size:14px">${l[0]}</div><div class="muted" style="font-size:11.5px">${l[1]} · ${FEST.stages[i%FEST.stages.length]}</div></div><span style="font-size:11px;font-weight:700;color:var(--muted)">21:30</span></div>`).join('')}</div>
      <div class="h2" style="margin-top:20px;font-size:15px">Scene</div><div class="scroll-x" style="margin-top:11px;padding:0">${FEST.stages.map((s,i)=>`<div style="min-width:130px;height:80px;border-radius:16px;padding:13px;background:${['#4c1d95','#241a44','#6d28d9','#0f766e'][i]};color:#fff;display:flex;flex-direction:column;justify-content:flex-end;font-weight:800;font-size:13px;border:1px solid var(--line-2)">${s}</div>`).join('')}</div></div>
    <div class="dock"><button class="cta" data-a="go:tickettypes">Cumpără abonament · de la $${FEST.from}</button></div></div>`;

  const NOTI=[['🎫','Biletele tale sunt gata','Coldplay · 2× QR în cont','acum 5 min',1],['🤖','Recomandare nouă pentru tine','Salina Turda — pentru că îți plac experiențele','acum 1h',1],['💳','Top-up reușit · +200 lei','Sold nou: 362 lei','azi 14:20',0],['🔥','Coldplay — ultimele bilete','Categoria II aproape epuizată','ieri',0]];
  S.notif=()=>`<div class="grid" style="min-height:100%">${sb()}<div class="between pad" style="padding-top:4px"><div class="row" style="gap:12px"><div class="icon-btn" data-a="back">${I.back}</div><div class="h2">Notificări</div></div><span style="color:var(--indigo-2);font-size:12.5px;font-weight:700">Citește tot</span></div>
    <div class="pad" style="margin-top:14px;display:flex;flex-direction:column;gap:10px">${NOTI.map(n=>`<div class="listitem" style="${n[4]?'background:var(--indigo-soft);border-color:var(--indigo-line)':''}"><div style="width:42px;height:42px;border-radius:13px;background:var(--surface-3);display:grid;place-items:center;font-size:19px">${n[0]}</div><div style="flex:1"><div style="font-weight:800;font-size:13.5px">${n[1]}</div><div class="muted" style="font-size:11.5px;margin-top:1px">${n[2]}</div><div style="font-size:10.5px;color:var(--faint);margin-top:3px">${n[3]}</div></div>${n[4]?`<span style="width:8px;height:8px;border-radius:50%;background:var(--indigo)"></span>`:''}</div>`).join('')}</div></div>`;

  function drawQR(cv,opt){const ctx=cv.getContext('2d');const n=25,q=2,N=n+q*2,s=cv.width/N;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle=(opt&&opt.color)||'#141020';let seed=((opt&&opt.seed)||7)*2654435761%2147483647;const rnd=()=>{seed=(seed*48271)%2147483647;return seed/2147483647;};const cell=(x,y)=>ctx.fillRect(Math.round((x+q)*s),Math.round((y+q)*s),Math.ceil(s),Math.ceil(s));const finder=(fx,fy)=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++){const b=(x===0||x===6||y===0||y===6),i=(x>=2&&x<=4&&y>=2&&y<=4);if(b||i)cell(fx+x,fy+y);}};finder(0,0);finder(n-7,0);finder(0,n-7);for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9))continue;if(x===6||y===6){if((x+y)%2===0)cell(x,y);continue;}if(rnd()>0.5)cell(x,y);}}

  let stack=[{id:'splash',data:{}}];const top=()=>stack[stack.length-1].id;
  function paint(dir){const {id,data}=stack[stack.length-1];const html=(S[id]||S.home)(data||{});const el=document.createElement('div');el.className='screen '+(dir==='back'?'enter-back':'enter-forward');el.innerHTML=html;const old=vp.querySelector('.screen');vp.appendChild(el);void el.offsetWidth;requestAnimationFrame(()=>{el.classList.remove('enter-back','enter-forward');if(old){old.classList.add(dir==='back'?'exit-back':'exit-forward');setTimeout(()=>old.remove(),420);}(INIT[id]||(()=>{}))(el,data||{});});el.scrollTop=0;}
  function rerender(){const cur=stack[stack.length-1];const el=vp.querySelector('.screen:last-child');if(!el)return;el.innerHTML=(S[cur.id])(cur.data||{});(INIT[cur.id]||(()=>{}))(el,cur.data||{});}
  function go(id,data){stack.push({id,data:data||{}});paint('forward');}
  function back(){if(stack.length>1){stack.pop();paint('back');}}
  function reset(id){stack=[{id,data:{}}];paint('forward');}
  const tabScreens=['home','explore','wallet','tickets','profile'];
  function tab(id){if(tabScreens.includes(top())){stack[stack.length-1]={id,data:{}};paint('forward');}else reset(id);}

  function recalcTT(){const ev=EV[ST.ev];const cur=vp.querySelector('.screen:last-child');if(!cur)return;if(!ST._ttCounts||ST._ttEv!==ST.ev){ST._ttCounts=ev.tt.map((_,i)=>i===0?1:0);ST._ttEv=ST.ev;}let cnt=0,tot=0;ev.tt.forEach((t,i)=>{const el=$('#tt'+i,cur);if(el)el.textContent=ST._ttCounts[i];cnt+=ST._ttCounts[i];tot+=ST._ttCounts[i]*t.p;});const c=$('#ttCount',cur),tt=$('#ttTotal',cur);if(c)c.textContent=cnt;if(tt)tt.textContent=tot+' lei';}
  function ttAdj(i,d){const ev=EV[ST.ev];if(!ST._ttCounts||ST._ttEv!==ST.ev){ST._ttCounts=ev.tt.map((_,k)=>k===0?1:0);ST._ttEv=ST.ev;}ST._ttCounts[i]=Math.max(0,(ST._ttCounts[i]||0)+d);recalcTT();}
  function toggleSeat(id){const i=ST.seats.indexOf(id);if(i>=0)ST.seats.splice(i,1);else ST.seats.push(id);const cur=vp.querySelector('.screen:last-child');const se=$$('.seat',cur).find(s=>s.dataset.a==='seat:'+id);if(se)se.classList.toggle('sel');const ev=EV[ST.ev];const sp=ev.tt.find(t=>t.seat)?.p||120;const c=$('#seatCount',cur),l=$('#seatList',cur),sm=$('#seatSum',cur);if(c)c.textContent=ST.seats.length;if(l)l.textContent=ST.seats.join(', ')||'niciunul';if(sm)sm.textContent=(ST.seats.length*sp)+' lei';}
  function updateCartTotals(){const cur=vp.querySelector('.screen:last-child');const c=cartCompute();const set=(id,v)=>{const e=$('#'+id,cur);if(e)e.textContent=v;};set('cSub',c.subtotal+' lei');set('cFee',lei(c.fee)+' lei');set('cProt',lei(c.protect)+' lei');set('cDisc','-'+c.disc+' lei');set('cTotal',lei(c.total)+' lei');set('cBtnTotal',lei(c.total));const pr=$('#cProtRow',cur),dr=$('#cDiscRow',cur);if(pr)pr.hidden=!c.protect;if(dr)dr.hidden=!c.disc;}
  function selectStay(i){ST.stayPin=i;rerender();}

  document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const parts=el.dataset.a.split(':');const a=parts[0],arg=parts[1];
    if(a==='back')return back();
    if(a==='go')return go(arg,parts[2]!==undefined?{id:parts[2],pi:parts[3]}:{});
    if(a==='tab')return tab(arg);
    if(a==='obNext'){if(ST.obStep>=OB.length-1){ST.obStep=0;return go('login');}ST.obStep++;return rerender();}
    if(a==='obBack'){if(ST.obStep>0){ST.obStep--;rerender();}return;}
    if(a==='pref'){const idx=ST.prefs.indexOf(arg);if(idx>=0)ST.prefs.splice(idx,1);else ST.prefs.push(arg);el.classList.toggle('on');return;}
    if(a==='prefsEdit'){ST.obStep=OB.length-1;return go('onboarding');}
    if(a==='ttInc')return ttAdj(+arg,1);
    if(a==='ttDec')return ttAdj(+arg,-1);
    if(a==='bundleAdd')return toast('Pachet adăugat în coș');
    if(a==='seat')return toggleSeat(arg);
    if(a==='stayPin')return selectStay(+arg);
    if(a==='tgl'){ST.cart[arg]=!ST.cart[arg];el.classList.toggle('on');updateCartTotals();return;}
    if(a==='applyDisc'){const inp=$('#discInput');if(inp&&inp.value.trim()){ST.cart.discount=30;toast('Cod aplicat · -30 lei');updateCartTotals();}return;}
    if(a==='searchDo'){const inp=$('#searchInput');if(inp){inp.value=arg;inp.dispatchEvent(new Event('input'));}return;}
    if(a==='ticsOut')return toast('Deschid '+arg+' ↗');
    if(a==='transferDone'){back();setTimeout(()=>toast('Bilet trimis! 🎉'),300);return;}
    if(a==='topupDone'){ST.balance+=200;back();setTimeout(()=>toast('Portofel încărcat · +200 lei'),300);return;}
    if(a==='fltToggle'){const p=$('#fltPanel');if(p)p.style.display=p.style.display==='none'?'block':'none';el.classList.toggle('on');return;}
    if(a==='logout'){ST.obStep=0;return reset('login');}
    if(a==='noop')return;
  });

  paint('forward');
})();
</script>
