    let cnt=0,tot=0;ev.tt.forEach((t,i)=>{const el=$('#tt'+i,cur);if(el)el.textContent=ST._ttCounts[i];cnt+=ST._ttCounts[i];tot+=ST._ttCounts[i]*t.p;});
    const c=$('#ttCount',cur),tt=$('#ttTotal',cur);if(c)c.textContent=cnt;if(tt)tt.textContent=tot+' lei';}
  function ttAdj(i,d){const ev=EV[ST.ev];if(!ST._ttCounts||ST._ttEv!==ST.ev){ST._ttCounts=ev.tt.map((_,k)=>k===0?1:0);ST._ttEv=ST.ev;}ST._ttCounts[i]=Math.max(0,(ST._ttCounts[i]||0)+d);recalcTT();}
  function toggleSeat(id){const i=ST.seats.indexOf(id);if(i>=0)ST.seats.splice(i,1);else ST.seats.push(id);const cur=vp.querySelector('.screen:last-child');const se=$$('.seat',cur).find(s=>s.dataset.a==='seat:'+id);if(se)se.classList.toggle('sel');const ev=EV[ST.ev];const sp=ev.tt.find(t=>t.seat)?.p||120;const c=$('#seatCount',cur),l=$('#seatList',cur),sm=$('#seatSum',cur);if(c)c.textContent=ST.seats.length;if(l)l.textContent=ST.seats.join(', ')||'niciunul';if(sm)sm.textContent=(ST.seats.length*sp)+' lei';}

  function updateCartTotals(){const cur=vp.querySelector('.screen:last-child');const c=cartCompute();
    const set=(id,v)=>{const e=$('#'+id,cur);if(e)e.textContent=v;};
    set('cSub',c.subtotal+' lei');set('cFee',lei(c.fee)+' lei');set('cProt',lei(c.protect)+' lei');set('cDisc','-'+c.disc+' lei');set('cTotal',lei(c.total)+' lei');set('cBtnTotal',lei(c.total));
    const pr=$('#cProtRow',cur),dr=$('#cDiscRow',cur);if(pr)pr.hidden=!c.protect;if(dr)dr.hidden=!c.disc;}

  document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const parts=el.dataset.a.split(':');const a=parts[0],arg=parts[1],arg2=parts[2];
    if(a==='back')return back();
    if(a==='go')return go(arg,arg2!==undefined?{id:arg2,pi:parts[3]}:{});
    if(a==='tab')return tab(arg);
    if(a==='obNext'){const sl=$('#obSlides');const i=Math.round(sl.scrollLeft/sl.clientWidth);if(i>=OB.length-1)return go('login');sl.scrollTo({left:sl.clientWidth*(i+1),behavior:'smooth'});return;}
    if(a==='pref'){const p=arg;const idx=ST.prefs.indexOf(p);if(idx>=0)ST.prefs.splice(idx,1);else ST.prefs.push(p);el.classList.toggle('on');return;}
    if(a==='ttInc')return ttAdj(+arg,1);
    if(a==='ttDec')return ttAdj(+arg,-1);
    if(a==='bundleAdd'){toast('Pachet adăugat în coș');return;}
    if(a==='seat')return toggleSeat(arg);
    if(a==='tgl'){ST.cart[arg]=!ST.cart[arg];el.classList.toggle('on');if(arg==='cultural'){const dot=el.closest('.listitem').querySelector('div:last-child');}updateCartTotals();return;}
    if(a==='applyDisc'){const inp=$('#discInput');if(inp&&inp.value.trim()){ST.cart.discount=30;toast('Cod aplicat · -30 lei');updateCartTotals();}return;}
    if(a==='searchDo'){const inp=$('#searchInput');if(inp){inp.value=arg;inp.dispatchEvent(new Event('input'));}return;}
    if(a==='transferDone'){back();setTimeout(()=>toast('Bilet trimis! 🎉'),300);return;}
    if(a==='topupDone'){ST.balance+=200;back();setTimeout(()=>toast('Portofel încărcat · +200 lei'),300);return;}
    if(a==='fltToggle'){const p=$('#fltPanel');if(p)p.style.display=p.style.display==='none'?'block':'none';el.classList.toggle('on');return;}
    if(a==='logout')return reset('login');
    if(a==='noop')return;
  });

  paint('forward');
})();
</script>
