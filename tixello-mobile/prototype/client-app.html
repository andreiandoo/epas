  :root{
    /* Tixello brand — DARK: purple primary, green + cyan accents, grid (from tixello.com) */
    --bg:#0A0711; --bg-2:#0E0A18; --surface:#15112230; --surface-solid:#151122; --surface-2:#1B1630; --surface-3:#231E39;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13); --line-3:rgba(255,255,255,.2);
    --ink:#F5F5FA; --ink-2:#C4C6D4; --muted:#8E92A6; --faint:#5F6379;
    --indigo:#8B5CF6; --indigo-2:#A996FA; --indigo-3:#7C3AED; --indigo-4:#6D28D9; --indigo-ink:#c4b5fd;
    --indigo-soft:rgba(139,92,246,.14); --indigo-line:rgba(139,92,246,.34);
    --green:#22C55E; --green-2:#3DDC97; --green-soft:rgba(34,197,94,.14); --green-line:rgba(34,197,94,.32);
    --cyan:#2DD6EE; --blue:#3B82F6; --cyan-soft:rgba(45,214,238,.13);
    --amber:#F59E0B; --amber-soft:rgba(245,158,11,.15); --red:#F0616D; --pink:#EC4899;
    --ui:'Outfit',ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;
    --sh:0 22px 46px -22px rgba(0,0,0,.7); --sh-sm:0 10px 24px -14px rgba(0,0,0,.6);
    --sh-p:0 16px 34px -14px rgba(124,58,237,.7);
    --grid:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    --glow:radial-gradient(680px 380px at 84% -6%, rgba(139,92,246,.22), transparent 62%);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--ui);color:var(--ink);letter-spacing:-.011em;
    background:radial-gradient(820px 520px at 84% -2%, #241a44, transparent 58%),radial-gradient(680px 480px at -6% 102%, #17122e, transparent 55%),#050309;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px 14px;overflow-x:hidden}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
  .hint{font-size:11.5px;color:#8a8fa6;font-weight:600} .hint b{color:var(--indigo-2)}
  /* modern iPhone frame */
  .device{position:relative;height:min(844px,calc(100vh - 64px));aspect-ratio:390/844;border-radius:56px;padding:12px;
    background:linear-gradient(145deg,#4a4d57,#17181e 42%,#101116 62%,#43454f);
    box-shadow:0 54px 110px -44px rgba(0,0,0,.78),inset 0 0 3px 1px rgba(255,255,255,.16)}
  .screenport{position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 2px #000}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:112px;height:31px;background:#000;border-radius:20px;z-index:60}
  .island::after{content:"";position:absolute;right:12px;top:9px;width:11px;height:11px;border-radius:50%;background:#0b0b12;box-shadow:inset 0 0 3px rgba(80,90,140,.7)}
  .vp{position:absolute;inset:0}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;transition:transform .4s cubic-bezier(.32,.9,.28,1),opacity .4s}
  .screen::-webkit-scrollbar{display:none}
  .enter-forward{transform:translateX(100%)} .exit-forward{transform:translateX(-24%);opacity:.5}
  .enter-back{transform:translateX(-100%)} .exit-back{transform:translateX(100%)}
  @media (prefers-reduced-motion:reduce){.screen{transition:opacity .2s}.enter-forward,.enter-back{transform:none;opacity:0}.exit-forward,.exit-back{opacity:0;transform:none}}
  .grid{background-color:var(--bg);background-image:var(--glow),var(--grid);background-size:100% 100%,30px 30px,30px 30px}

  .sb{display:flex;justify-content:space-between;align-items:center;padding:15px 26px 4px;font-size:13px;font-weight:500;color:#fff}
  .sb .dd{display:flex;gap:5px;align-items:center}
  .pad{padding:0 20px} .row{display:flex;align-items:center;gap:10px} .between{display:flex;align-items:center;justify-content:space-between}
  .muted{color:var(--muted)} .tnum{font-variant-numeric:tabular-nums} svg{display:block}
  .h1{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.08} .h2{font-size:16px;font-weight:600;letter-spacing:-.02em}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo-2)}
  .cyan-grad{background:linear-gradient(100deg,#67e8f9,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;transition:transform .12s}
  .icon-btn:active{transform:scale(.9)}
  .icon-btn.glass{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(10px)}
  .cta{border:0;font:inherit;cursor:pointer;width:100%;padding:17px;border-radius:16px;font-weight:600;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--indigo),var(--indigo-3));box-shadow:var(--sh-p);display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s}
  .cta:active{transform:translateY(1px) scale(.995)}
  .cta.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
  .cta.dark{background:#fff;color:#141020} .cta.block2{justify-content:space-between}
  .cta.green{background:linear-gradient(135deg,var(--green),#16a34a);box-shadow:0 16px 30px -14px rgba(34,197,94,.6)}
  .chip{border:0;font:inherit;cursor:pointer;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:500;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;flex:none;transition:.16s}
  .chip.on{background:#fff;color:#141020;border-color:#fff}
  .chip.ind.on{background:linear-gradient(135deg,var(--indigo),var(--indigo-3));border-color:transparent;color:#fff;box-shadow:var(--sh-p)}
  .scroll-x{display:flex;gap:9px;overflow-x:auto;padding:2px 20px;scrollbar-width:none} .scroll-x::-webkit-scrollbar{display:none}
  .badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px}
  .card{background:var(--surface-solid);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh-sm)}
  .poster{position:relative;overflow:hidden;background:var(--tone,#3a2b4d)}
  .poster::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 18% 0%,rgba(255,255,255,.22),transparent 52%),radial-gradient(90% 76% at 100% 100%,rgba(0,0,0,.5),transparent 60%)}
  .poster .glyph{position:absolute;right:-4px;bottom:-14px;font-size:88px;opacity:.22;color:#fff}
  .poster .tag{position:absolute;top:12px;left:12px;font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.34);backdrop-filter:blur(6px);padding:4px 9px;border-radius:999px}

  /* ===== PUNCTE & RECOMPENSE ===== */

      <div class="pad" style="margin-top:14px"><div class="walletcard fade-up" style="background:linear-gradient(140deg,#3a2a08,#b7791f 135%)"><div style="position:absolute;right:-24px;top:-24px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)"></div>
        <div class="between"><div><div style="font-size:11px;opacity:.8;font-weight:500">Puncte Tixello</div><div style="font-size:34px;font-weight:600;margin-top:2px">${cur} <span style="font-size:15px;opacity:.7">pct</span></div></div><div style="width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center">${I.star}</div></div>
        <div style="margin-top:18px"><div class="between" style="font-size:11px;opacity:.85;margin-bottom:6px"><span>Nivel Silver</span><span>${next-cur} pct până la Gold</span></div><div style="height:7px;border-radius:9px;background:rgba(255,255,255,.22)"><div style="height:100%;width:${pct}%;background:#fff;border-radius:9px"></div></div></div></div></div>
      <div class="pad" style="margin-top:16px"><div class="h2" style="font-size:15px;margin-bottom:10px">Cum câștigi puncte</div><div style="display:flex;flex-direction:column;gap:10px">${[['🎟','1 leu cheltuit','+1 punct'],['🤝','Un prieten se înscrie cu codul tău','+250 pct'],['⭐','Lași o recenzie','+50 pct'],['🎂','De ziua ta','+500 pct']].map(r=>`<div class="listitem"><div style="width:38px;height:38px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;font-size:17px">${r[0]}</div><div style="flex:1;font-weight:500;font-size:13.5px">${r[1]}</div><span class="pts">${r[2]}</span></div>`).join('')}</div></div>
      <div class="pad" style="margin-top:20px"><div class="h2" style="font-size:15px;margin-bottom:10px">Recompense disponibile</div><div style="display:flex;flex-direction:column;gap:10px">${REWARDS.map(r=>{const cost=parseInt(r[2]);const can=r[3]==='ok';return `<div class="card" style="padding:13px;display:flex;align-items:center;gap:12px;${!can?'opacity:.55':''}"><div style="width:44px;height:44px;border-radius:13px;background:var(--surface-3);display:grid;place-items:center;font-size:20px">${r[0]}</div><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${r[1]}</div><div class="pts" style="margin-top:4px">${I.star} ${r[2].replace('-',' pct')}</div></div><button class="chip ${can?'ind on':''}" data-a="${can?'redeem':'noop'}" style="padding:8px 14px">${can?'Folosește':'🔒'}</button></div>`;}).join('')}</div></div>
      <div style="height:10px"></div>${nav('profile')}</div>`;
  };

  /* ===== INVITĂ PRIETENI (afiliere) ===== */
  S.invite=()=>`<div class="grid" style="min-height:100%">${topbar(`<div class="row" style="gap:12px"><div class="icon-btn" data-a="back">${I.back}</div><div class="h2">Invită prieteni</div></div><div class="icon-btn">${I.info}</div>`)}
    <div class="pad" style="margin-top:14px"><div class="card" style="padding:20px;text-align:center;background:linear-gradient(160deg,var(--indigo-3),#2a1065);border:1px solid var(--line-2);color:#fff;position:relative;overflow:hidden"><div style="position:absolute;right:-14px;bottom:-18px;font-size:90px;opacity:.18">🤝</div>

      <div style="margin-top:16px;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.4);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px"><div style="flex:1;text-align:left"><div style="font-size:10px;opacity:.75;font-weight:600">CODUL TĂU</div><div style="font-size:20px;font-weight:600;letter-spacing:1px">${AFF.code}</div></div><button class="circ" data-a="copyAff" style="position:static;width:40px;height:40px;background:#fff;color:#141020;border-color:#fff" aria-label="Copiază codul">${I.copy}</button></div></div></div>

    <div class="pad" style="margin-top:20px"><div class="h2" style="font-size:15px;margin-bottom:10px">Prietenii tăi</div><div style="display:flex;flex-direction:column;gap:10px">${AFF.friends.map(f=>`<div class="listitem"><div style="width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--indigo-2),var(--indigo-4));display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px">${f[1]}</div><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${f[0]}</div><div class="muted" style="font-size:11px">${f[2]}</div></div><span class="badge" style="background:var(--green-soft);color:var(--green-2)">prieten</span></div>`).join('')}</div></div>

  /* ===== SETĂRI ===== */
  S.settings=()=>`<div class="grid" style="min-height:100%">${topbar(`<div class="row" style="gap:12px"><div class="icon-btn" data-a="back">${I.back}</div><div class="h2">Setări cont</div></div><div style="width:42px"></div>`)}

      <div class="pad" style="margin-top:14px"><div class="card" style="padding:13px;display:flex;gap:12px;align-items:center">${poster(ev,'','width:52px;height:52px;border-radius:14px;flex:none')}<div style="flex:1"><div style="font-weight:600;font-size:14px">${ev.s}</div><div class="muted" style="font-size:11.5px">${ev.d} · ${v.name}</div></div></div></div>

  S.festival=()=>`<div style="min-height:100%;background:var(--bg);padding-bottom:2px">
    <div class="poster" style="background:${FEST.tone};height:280px;border-radius:0 0 30px 30px"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 30%,rgba(11,9,18,.96))"></div>${sb()}

  function ttAdj(i,d){const ev=EV[ST.ev];if(!ST._ttCounts||ST._ttEv!==ST.ev){ST._ttCounts=ev.tt.map((_,k)=>k===0?1:0);ST._ttEv=ST.ev;}ST._ttCounts[i]=Math.max(0,(ST._ttCounts[i]||0)+d);recalcTT();}
  function toggleSeat(id){const i=ST.seats.indexOf(id);if(i>=0)ST.seats.splice(i,1);else ST.seats.push(id);const cur=vp.querySelector('.screen:last-child');const se=$$('.seat',cur).find(s=>s.dataset.a==='seat:'+id);if(se)se.classList.toggle('sel');const ev=EV[ST.ev];const sp=ev.tt.find(t=>t.seat)?.p||120;const c=$('#seatCount',cur),l=$('#seatList',cur),sm=$('#seatSum',cur);if(c)c.textContent=ST.seats.length;if(l)l.textContent=ST.seats.join(', ')||'niciunul';if(sm)sm.textContent=(ST.seats.length*sp)+' lei';}
  function updateCartTotals(){const cur=vp.querySelector('.screen:last-child');const c=cartCompute();const set=(id,v)=>{const e=$('#'+id,cur);if(e)e.textContent=v;};set('cSub',c.subtotal+' lei');set('cFee',lei(c.fee)+' lei');set('cProt',lei(c.protect)+' lei');set('cDisc','-'+c.disc+' lei');set('cTotal',lei(c.total)+' lei');set('cBtnTotal',lei(c.total));const pr=$('#cProtRow',cur),dr=$('#cDiscRow',cur);if(pr)pr.hidden=!c.protect;if(dr)dr.hidden=!c.disc;}
  const panStay=i=>{const s=STAY[i];return s?`translate(${(50-s.x).toFixed(2)}%,${(50-s.y).toFixed(2)}%)`:'translate(0%,0%)';};
  function catRerender(){const cur=vp.querySelector('.screen:last-child');const wasOpen=(()=>{const p=$('#fltPanel',cur);return p&&p.style.display!=='none';})();rerender();if(wasOpen){const p=$('#fltPanel',vp.querySelector('.screen:last-child'));if(p)p.style.display='block';const fb=$('.filterbar .flt',vp.querySelector('.screen:last-child'));if(fb)fb.classList.add('on');}}
  function selectStay(i){ST.stayPin=i;const cur=vp.querySelector('.screen:last-child');if(!cur)return rerender();const mi=$('#mapinner',cur);if(!mi)return rerender();mi.style.transform=panStay(i);$$('.mappin',cur).forEach((p,j)=>p.classList.toggle('on',j===i));const cards=$$('#stayList .card',cur);cards.forEach((c,j)=>c.style.borderColor=(j===i?'var(--indigo)':'var(--line)'));if(cards[i])cards[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}

  document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const parts=el.dataset.a.split(':');const a=parts[0],arg=parts[1];
    if(a==='back')return back();
    if(a==='go')return go(arg,parts[2]!==undefined?{id:parts[2],pi:parts[3]}:{});
    if(a==='tab')return tab(arg);
    if(a==='obNext'){if(ST.obStep>=OBALL.length-1){ST.obStep=0;return go('login');}ST._obDir='fwd';ST.obStep++;return rerender();}
    if(a==='obBack'){if(ST.obStep>0){ST._obDir='back';ST.obStep--;rerender();}return;}
    if(a==='pref'){const idx=ST.prefsSel.indexOf(arg);if(idx>=0)ST.prefsSel.splice(idx,1);else ST.prefsSel.push(arg);el.classList.toggle('on');return;}
    if(a==='prefsEdit'){ST.obStep=OB.length;return go('onboarding');}
    if(a==='ttInc')return ttAdj(+arg,1);
    if(a==='ttDec')return ttAdj(+arg,-1);
    if(a==='bundleAdd')return toast('Pachet adăugat în coș');
    if(a==='seat')return toggleSeat(arg);
    if(a==='stayPin')return selectStay(+arg);
    if(a==='catSort'){const order=['rec','price','rating'];ST.catF.sort=order[(order.indexOf(ST.catF.sort)+1)%order.length];return catRerender();}
    if(a==='catCity'){ST.catF.city=ST.catF.city===arg?'':arg;return catRerender();}
    if(a==='catSeat'){ST.catF.seated=!ST.catF.seated;return catRerender();}
    if(a==='catReset'){ST.catF={sort:'rec',maxPrice:500,city:'',seated:false};return catRerender();}
    if(a==='save'){const i=ST.saved.indexOf(arg);if(i>=0){ST.saved.splice(i,1);toast('Scos din salvate');}else{ST.saved.push(arg);toast('Salvat ♥');}return rerender();}
    if(a==='unsave'){const i=ST.saved.indexOf(arg);if(i>=0)ST.saved.splice(i,1);toast('Scos din salvate');return rerender();}
    if(a==='redeem')return toast('Recompensă activată 🎉');
    if(a==='copyAff')return toast('Cod copiat · '+AFF.code);
    if(a==='shareAff')return toast('Invitație pregătită de trimis 🎉');
    if(a==='festBuy'){ST.ev='nordvale';ST._ttCounts=null;return go('tickettypes');}
    if(a==='setTgl'){const t=el.querySelector('.toggle');if(t)t.classList.toggle('on');return;}
    if(a==='openReview'){ST.revRating=0;ST.revTab=0;ST._revDraft='';return go('review',{id:arg});}
    if(a==='revTab'||a==='revStar'){const cur=vp.querySelector('.screen:last-child');const tx=$('#revTxt',cur);if(tx)ST._revDraft=tx.value;if(a==='revStar')ST.revRating=+arg;else ST.revTab=+arg;return rerender();}
    if(a==='revSubmit'){if(!ST.revRating)return toast('Alege un rating întâi ⭐');ST.points+=50;back();setTimeout(()=>toast('Recenzie trimisă · +50 puncte 🎉'),300);return;}
    if(a==='lb'){const type=arg,id=parts[2],idx=+parts[3];let gal=[],gly='🖼';if(type==='ev'){gal=EV[id].gallery;gly=EV[id].g;}else if(type==='fest'){gal=FEST.gallery;gly='🎪';}else if(type==='tics'){gal=TICS[id].gallery;gly=TICS[id].g;}return openLB(gal,idx,gly);}
    if(a==='lbClose')return closeLB();
    if(a==='lbPrev')return stepLB(-1);
    if(a==='lbNext')return stepLB(1);
    if(a==='shLike'){el.classList.toggle('liked');const bt=el.querySelector('.b');const liked=el.classList.contains('liked');if(bt)bt.innerHTML=liked?I.heart:I.heartO;return;}
    if(a==='forgotSend'){const inp=$('#forgotEmail');const v=inp&&inp.value.trim();if(!v)return toast('Adaugă adresa de email');back();setTimeout(()=>toast('Link de resetare trimis către '+v+' 📧'),300);return;}
    if(a==='inviteSend'){const inp=$('#inviteEmail');const v=inp&&inp.value.trim();if(!v)return toast('Adaugă un email de invitat');if(inp)inp.value='';toast('Invitație trimisă către '+v+' 🎉');return;}
    if(a==='tgl'){ST.cart[arg]=!ST.cart[arg];if(arg==='nameOnTicket'||arg==='cultural'){rerender();}else{el.classList.toggle('on');updateCartTotals();}return;}
    if(a==='expDate'){ST.expDate=+arg;rerender();return;}
    if(a==='expDay'){ST.expDay=+arg;rerender();return;}
    if(a==='addon'){ST.addons[arg]=!ST.addons[arg];el.classList.toggle('on');recalcTT();return;}
    if(a==='fstage'){ST.fStage=+arg;rerender();return;}
    if(a==='fday'){ST.fDay=arg;rerender();return;}
    if(a==='calDay'){ST.calDay=+arg;rerender();return;}
    if(a==='applyDisc'){const inp=$('#discInput');if(inp&&inp.value.trim()){ST.cart.discount=30;toast('Cod aplicat · -30 lei');updateCartTotals();}return;}
    if(a==='searchDo'){const inp=$('#searchInput');if(inp){inp.value=arg;inp.dispatchEvent(new Event('input'));}return;}
    if(a==='ticsOut')return toast('Deschid '+arg+' ↗');
    if(a==='transferDone'){back();setTimeout(()=>toast('Bilet trimis! 🎉'),300);return;}
    if(a==='topupDone'){ST.balance+=200;back();setTimeout(()=>toast('Portofel încărcat · +200 lei'),300);return;}
    if(a==='fltToggle'){const p=$('#fltPanel');if(p)p.style.display=p.style.display==='none'?'block':'none';el.classList.toggle('on');return;}
    if(a==='logout'){ST.obStep=0;return reset('login');}
    if(a==='noop')return;
  });

  paint('forward');
})();
</script>
