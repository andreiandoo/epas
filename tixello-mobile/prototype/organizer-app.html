/* ============================================================
   Tixello — interactive organizer prototype
   Shares the client app's identity: 'Outfit' typeface, indigo/violet
   primary (#8B5CF6 → #7C3AED gradients) on a near-black ground, rounded
   cards, purple-glow shadows. Dark-first, exactly like the Tixello client
   app — one cohesive identity across every account type. --accent is the
   single brand hue everywhere (no per-vertical recoloring); the context
   switcher changes identity & data only. Light/Contrast are alternates.
   ============================================================ */
:root{
  /* studio backdrop (outside the phone) */
  --studio:#0A0711; --studio-2:#07050D; --studio-panel:#151122;
  --studio-line:rgba(255,255,255,.08); --studio-text:#E9E7F5; --studio-text-2:#9A94B0;

  /* ---- Tixello brand accent (indigo/violet — constant everywhere) ---- */
  --accent:#8B5CF6; --accent-700:#7C3AED; --accent-accent:#A996FA;
  --accent-tint:rgba(139,92,246,.15); --accent-tint-2:rgba(139,92,246,.24);
  --accent-border:rgba(139,92,246,.34); --accent-glow:rgba(124,58,237,.6);

  /* ---- app neutrals — DEFAULT = Tixello dark (client-app identity) ---- */
  --bg:#0A0711; --surface:#151122; --surface-2:#1B1630;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.17);
  --text:#F5F5FA; --text-2:#C4C6D4; --text-3:#8E92A6; --text-4:#5F6379;
  --track:#231E39; --shadow-color:0,0,0;

  /* ---- semantic (client-app values) ---- */
  --green:#22C55E; --green-tint:rgba(34,197,94,.15); --green-border:rgba(34,197,94,.34);
  --amber:#F59E0B; --amber-tint:rgba(245,158,11,.16); --amber-border:rgba(245,158,11,.32);
  --danger:#F0616D; --danger-tint:rgba(240,97,109,.16); --danger-border:rgba(240,97,109,.34);
  --cyan:#2DD6EE; --cyan-tint:rgba(45,214,238,.14); --cyan-border:rgba(45,214,238,.32);

  /* role pills */
  --role-admin-bg:rgba(240,97,109,.16); --role-admin-fg:#F0616D;
  --role-mgr-bg:rgba(34,197,94,.15); --role-mgr-fg:#3DDC97;
  --role-staff-bg:rgba(255,255,255,.08); --role-staff-fg:#C4C6D4;
  /* avatars */
  --av-red-bg:rgba(240,97,109,.18);--av-red-fg:#F0616D;--av-blue-bg:rgba(59,130,246,.2);--av-blue-fg:#93B4FB;
  --av-amber-bg:rgba(245,158,11,.2);--av-amber-fg:#F5B740;--av-purple-bg:rgba(139,92,246,.22);--av-purple-fg:#C4B5FD;

  --radius:18px; --radius-lg:22px; --radius-sm:12px;
  --shadow-sm:0 10px 24px -14px rgba(0,0,0,.6);
  --shadow:0 22px 46px -22px rgba(0,0,0,.7);
  --shadow-btn:0 16px 34px -14px rgba(124,58,237,.7);
  --grad:linear-gradient(135deg,var(--accent),var(--accent-700));
  --font:'Outfit',ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,Monaco,"Cascadia Code",monospace;
}
/* ---- App theme: Standard (Tixello light — indigo on white) ---- */
.phone[data-app-theme="light"]{
  --bg:#F4F2FB; --surface:#FFFFFF; --surface-2:#FAF8FF;
  --border:#EBE7F5; --border-strong:#DED8EE;
  --text:#1A1626; --text-2:#5B5570; --text-3:#8B85A0; --text-4:#B8B2C8;
  --track:#EEE9FA; --shadow-color:60,40,110;
  --accent-tint:#F1ECFD; --accent-tint-2:#E7DEFB; --accent-border:rgba(124,58,237,.22);
  --green-tint:#E7F8EE; --green-border:rgba(22,163,74,.22); --amber-tint:#FEF3E2; --amber-border:rgba(217,119,6,.22);
  --danger-tint:#FDEBEC; --danger-border:rgba(220,60,72,.22); --cyan-tint:#E3F8FC; --cyan-border:rgba(14,150,180,.22);
  --role-admin-bg:#FDEBEC;--role-admin-fg:#D14350;--role-mgr-bg:#E7F8EE;--role-mgr-fg:#15803D;--role-staff-bg:#EEEAF6;--role-staff-fg:#5B5570;
  --av-red-bg:#FDE7E9;--av-red-fg:#D14350;--av-blue-bg:#E5EDFC;--av-blue-fg:#2563EB;--av-amber-bg:#FCEFD6;--av-amber-fg:#B45309;--av-purple-bg:#EEE7FD;--av-purple-fg:#6D28D9;
  --shadow-sm:0 1px 2px rgba(60,40,110,.05);
  --shadow:0 1px 2px rgba(60,40,110,.05),0 10px 28px -12px rgba(60,40,110,.14);
}
/* ---- App theme: Contrast Mărit (brighter dark) ---- */
.phone[data-app-theme="lowlight"]{
  --surface:#1B1630;--surface-2:#231E39;--border:rgba(255,255,255,.2);--border-strong:rgba(255,255,255,.32);
  --text:#FFFFFF;--text-2:#DADCE8;--text-3:#A2A5B8;--text-4:#787C90;--track:#2A2442;
}
/* ---- App theme: Noapte (= default Tixello dark, explicit) ---- */
.phone[data-app-theme="dark"]{
  --bg:#0A0711; --surface:#151122; --surface-2:#1B1630;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.17);
  --text:#F5F5FA; --text-2:#C4C6D4; --text-3:#8E92A6; --text-4:#5F6379; --track:#231E39;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--studio); color:var(--studio-text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; display:flex;
}
@media (max-width:900px){ body{flex-direction:column} }

/* ============ STUDIO CONTROL RAIL ============ */
.rail{
  width:288px; flex:0 0 288px; background:linear-gradient(180deg,var(--studio-2),var(--studio));
  border-right:1px solid var(--studio-line); padding:22px 18px 30px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
@media (max-width:900px){ .rail{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--studio-line)} }
.rail-brand{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.rail-logo{font-weight:700;font-size:15px;letter-spacing:-.4px;color:#fff;background:var(--grad);
  padding:6px 11px;border-radius:11px;box-shadow:0 6px 16px -4px var(--accent-glow)}
.rail-logo-scan{font-size:15px;font-weight:700;color:#fff}
.rail-sub{font-size:12px;color:var(--studio-text-2);line-height:1.5;margin:12px 0 20px}
.rail-sub b{color:#fff;font-weight:700}
.rail-group{margin-bottom:20px}
.rail-label{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--studio-text-2);margin-bottom:9px}
.seg{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:4px;border-radius:12px;border:1px solid var(--studio-line)}
.seg button{flex:1;border:none;background:transparent;color:var(--studio-text-2);font-family:var(--font);
  font-size:12.5px;font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.ctx-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--studio-line);background:rgba(255,255,255,.04);

.ctx-chip:hover{background:rgba(255,255,255,.08)}
.ctx-chip .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.ctx-chip.on{border-color:#fff;background:rgba(255,255,255,.12);color:#fff}
.rail-note{font-size:11.5px;color:var(--studio-text-2);line-height:1.55;
  border-top:1px solid var(--studio-line);padding-top:16px;margin-top:6px}
.rail-note code{font-family:var(--mono);font-size:10.5px;color:#f0c0c0;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px}
.rail-jump{display:flex;flex-direction:column;gap:6px}
.rail-jump button{display:flex;align-items:center;gap:9px;border:1px solid var(--studio-line);background:rgba(255,255,255,.03);
  color:var(--studio-text);font-family:var(--font);font-size:12.5px;font-weight:600;padding:9px 11px;border-radius:10px;cursor:pointer;text-align:left;transition:.15s}
.rail-jump button:hover{background:rgba(255,255,255,.08);color:#fff}
.rail-jump svg{width:15px;height:15px;color:var(--studio-text-2);flex:0 0 auto}

/* ============ STAGE ============ */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:38px 24px 60px;gap:16px;min-width:0}
.stage-caption{max-width:390px;text-align:center;color:var(--studio-text-2);font-size:12.5px;line-height:1.5}
.stage-caption b{color:#fff;display:block;font-size:14px;margin-bottom:3px}

/* ============ PHONE ============ */
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:11px solid #0c0708;
  box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 2px #2a1c1d;position:relative;overflow:hidden;
  display:flex;flex-direction:column;flex:0 0 auto}
.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:30px;
  background:#0c0708;border-bottom-left-radius:18px;border-bottom-right-radius:18px;z-index:60}
.statusbar{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px 0 30px;font-size:13px;font-weight:600;color:var(--text);z-index:50}
.statusbar .r{display:flex;gap:6px;align-items:center;font-size:12px}
.app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
.pad{padding:16px}
.stack>*+*{margin-top:12px}

/* ============ SHARED APP COMPONENTS ============ */
.appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 12px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-logo{font-weight:700;font-size:15px;letter-spacing:-.4px;color:#fff;background:var(--grad);
  padding:6px 11px;border-radius:11px;box-shadow:0 6px 16px -4px var(--accent-glow)}
.brand-scan{font-size:15px;font-weight:700;color:var(--text)}
.brand-switch{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);
  padding:6px 10px;border-radius:10px;cursor:pointer;max-width:190px}
.brand-switch .nm{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-switch svg{width:15px;height:15px;color:var(--text-3);flex:0 0 auto}
.appbar-right{display:flex;align-items:center;gap:9px}
.pagetitle{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill-live{background:var(--green-tint);color:var(--green)}
.pill-live .dot{background:var(--green);animation:pulse 1.8s infinite}
.pill-off{background:var(--danger-tint);color:var(--danger)}
.pill-off .dot{background:var(--danger)}
.pill-amber{background:var(--amber-tint);color:var(--amber);cursor:pointer}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;position:relative;color:var(--text-2);cursor:pointer;flex:0 0 auto}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .badge{position:absolute;top:-3px;right:-3px;background:var(--accent-accent);color:#fff;font-size:10px;
  font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--surface);padding:0 4px}

.h1{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.h2{font-size:17px;font-weight:700;color:var(--text)}
.sub{font-size:13px;color:var(--text-2)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent-accent)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.section-head h3{font-size:15px;font-weight:700;color:var(--text)}
.link{color:var(--accent-accent);font-size:13px;font-weight:700;cursor:pointer;background:none;border:none;font-family:var(--font)}
.muted{color:var(--text-2)}
.center{text-align:center}
.divider{height:1px;background:var(--border);margin:14px 0}
.pull-hint{text-align:center;font-size:12px;color:var(--text-3);padding:10px 0}
.tnum{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card.pad{padding:16px}
.chip-i{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chip-i svg{width:20px;height:20px}
.chip-red{background:var(--accent-tint);color:var(--accent)}
.chip-green{background:var(--green-tint);color:var(--green)}
.chip-amber{background:var(--amber-tint);color:var(--amber)}
.chip-cyan{background:var(--cyan-tint);color:var(--cyan)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm)}
.row+.row{margin-top:8px}
.row .grow{flex:1;min-width:0}
.row .name{font-size:14.5px;font-weight:600;color:var(--text)}
.row .meta{font-size:12px;color:var(--text-3);margin-top:2px}
.chev{color:var(--text-3);width:18px;height:18px;flex:0 0 auto}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;flex:0 0 auto}
.tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}

.tag-mgr{background:var(--role-mgr-bg);color:var(--role-mgr-fg)}
.tag-staff{background:var(--role-staff-bg);color:var(--role-staff-fg)}
.tag-active{color:var(--green);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.tag-active::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
.stat .label{font-size:12.5px;color:var(--text-2);font-weight:600}
.stat .value{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:4px;color:var(--text)}
.stat .unit{font-size:12px;color:var(--text-3);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.bar{height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.bar.green>span{background:var(--green)}
.seg-bar{display:flex;height:40px;border-radius:12px;overflow:hidden;font-size:12.5px;font-weight:700;cursor:pointer}
.seg-bar .on{background:var(--accent);color:#fff;display:flex;align-items:center;padding:0 12px;min-width:0}
.seg-bar .door{background:var(--accent-tint-2);color:var(--accent-700);display:flex;align-items:center;justify-content:flex-end;padding:0 12px;flex:1;min-width:0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;font-family:var(--font);
  font-size:15px;font-weight:700;padding:15px;width:100%;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.985)}

.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-danger-text{background:none;color:var(--accent-accent);font-weight:700;border:none;font-family:var(--font);font-size:13px;cursor:pointer}
.btn-green{background:var(--green);color:#fff}

.tabbar{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 6px 20px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-3);cursor:pointer;background:none;border:none;font-family:var(--font);padding:2px 0}
.tab.active{color:var(--accent)}
.tab.disabled{color:var(--text-4);opacity:.55}
.tab svg{width:22px;height:22px}
.tab span{font-size:11px;font-weight:600}

/* toggle */
.tgl{width:44px;height:26px;border-radius:999px;background:var(--border-strong);position:relative;flex:0 0 auto;cursor:pointer;transition:.2s;border:none}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tgl.on{background:var(--accent)}
.tgl.on::after{left:20px}

/* seat map */
.seat{width:19px;height:19px;border-radius:5px;display:inline-block;background:var(--border-strong);cursor:pointer}
.seat.g{background:var(--green)}
.seat.sel{background:var(--accent);box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1.5px var(--accent)}
.seat.a{background:var(--border-strong);cursor:not-allowed}
.seat.d{background:transparent;cursor:default}

/* overlays / sheets */
.overlay{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(20,10,10,.42);animation:fade .18s ease}
.overlay.center{justify-content:center;align-items:center;padding:22px}
.overlay.top{justify-content:flex-start;background:rgba(20,10,10,.18)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;max-height:90%;display:flex;flex-direction:column;
  animation:slideup .24s cubic-bezier(.2,.9,.3,1)}
@keyframes slideup{from{transform:translateY(30px)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:10px auto 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 12px}

.sheet-body{overflow-y:auto;padding:0 16px 22px}
.sheet-body::-webkit-scrollbar{width:0}
.fullmodal{position:absolute;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column;animation:fade .16s ease}
.modal-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.modal-topbar b{font-size:17px;font-weight:800;color:var(--text)}
.flash{position:absolute;inset:0;z-index:90;pointer-events:none;animation:flashfade .5s ease forwards}
@keyframes flashfade{0%{opacity:.5}100%{opacity:0}}

.inputbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;
  font-size:14.5px;color:var(--text);font-family:var(--font);width:100%}
.inputbox::placeholder{color:var(--text-3)}
.inputbox:focus{outline:2px solid var(--accent-border);border-color:var(--accent)}
.fieldlabel{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block}
.typechip{font-size:12px;font-weight:700;padding:7px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);cursor:pointer}
.typechip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:95;background:var(--text);color:var(--bg);
  border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);
  display:flex;align-items:center;gap:10px;animation:toastin .2s ease}
@keyframes toastin{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

/* ---------- unified-login identity model ----------
   One email → one or more "properties". Multiple → chooser after login;
   single → straight into that shell. Switch client↔organizer anytime. */
function identityProps(){
  const client={kind:'client',key:'client',name:'Andrei Popescu',sub:'Cont client Tixello',icon:'user',av:'purple'};
  const orgs=[
    {kind:'org',key:'organizer',account:'organizer',ctx:'organizer',name:'Nord Events',sub:'Organizator · concerte',role:'admin',icon:'star',av:'red'},
    {kind:'org',key:'festival',account:'organizer',ctx:'festival',name:'Neversea',sub:'Festival · cashless',role:'manager',icon:'ticket',av:'amber'},
    {kind:'org',key:'venue',account:'venue',ctx:'organizer',name:'Delta Adventure Park',sub:'Leisure · venue-owner',role:'admin',icon:'boat',av:'blue'},
  ];
  if(S.loginIdentity==='clientonly') return [client];
  if(S.loginIdentity==='orgonly') return orgs;
  return [client,...orgs];
}
function applyProp(p){
  if(p.kind==='client'){S.mode='client';S.clientTab='Acasa';}
  else{S.mode='organizer';S.account=p.account;S.ctx=p.ctx;S.role=p.role;
    S.tab=p.account==='venue'?'VenueEvents':'Dashboard';S.venueScreen='list';S.sale='select';S.cart={};}
  S.modal=null;
}
function setIdentity(k){S.loginIdentity=k;S.authed=true;login();}
function switchMode(){const props=identityProps();
  if(S.mode==='client'){const o=props.find(p=>p.kind==='org');if(o){applyProp(o);}else{toast('Acest email nu are cont de organizator');return;}}
  else{const c=props.find(p=>p.kind==='client');if(c){applyProp(c);}else{toast('Acest email nu are cont de client');return;}}
  render();
}

/* ---------- SALES flow ---------- */
function addCart(i){const t=cx().tt[i];if(t.s>=t.q)return;S.cart[i]=(S.cart[i]||0)+1;render();}
function subCart(i){if(!S.cart[i])return;S.cart[i]--;if(!S.cart[i])delete S.cart[i];render();}
function cartCount(){return Object.values(S.cart).reduce((a,b)=>a+b,0);}
function cartTotal(){return Object.entries(S.cart).reduce((a,[i,q])=>a+cx().tt[i].p*q,0);}
function toCart(){if(cartCount())S.sale='cart';render();}
function payConfirm(m){openModal('payconfirm',m);}
function payProcess(){closeModal();S.sale='success';render();}
function finishSale(){S.sale='select';S.cart={};S.scan='idle';toast('Vânzare finalizată · bilete emise');render();}

      <div class="card pad"><div class="label" style="font-size:12.5px;color:var(--text-2);font-weight:600">Ora de Vârf</div><div class="tnum" style="font-size:26px;font-weight:800;color:var(--text)">20:00</div></div>

function venueTabbar(){
  const t=(name,icon,label)=>`<button class="tab ${S.tab===name?'active':''}" onclick="go('${name}')">${ic(icon,22)}<span>${label}</span></button>`;
  return `<div class="tabbar">${t('VenueEvents','cal','Evenimente')}${t('CheckIn','scan','Scanare')}${t('Sales','cart','Vânzare')}${t('Settings','cog','Setări')}</div>`;
}
function venueShell(){
  let body='';
  if(S.tab==='VenueEvents'){
    body = S.venueScreen==='detail'?venueDetail():S.venueScreen==='ticket'?venueTicketDetail():venueList();
  } else if(S.tab==='CheckIn'){ body=venueEventBand()+`<div style="flex:1;display:flex;flex-direction:column;min-height:0">${checkinScreen()}</div>`; }
  else if(S.tab==='Sales'){ body=venueEventBand()+`<div style="flex:1;display:flex;flex-direction:column;min-height:0">${salesScreen()}</div>`; }
  else if(S.tab==='Settings'){ body=venueSettings(); }
  return `${body}${venueTabbar()}${renderModal()}${S.toast?`<div class="toast">${ic('checkc',18)}${S.toast}</div>`:''}`;
}

/* ---- live occupancy per zone/gate + thresholds ---- */

    <div class="bar"><span style="width:${p}%;background:var(--${col})"></span></div>

/* ---- cash reconciliation / Z-report ---- */
function mCashCount(){
  const den=[[200,4],[100,6],[50,3],[10,5],[5,4],[1,10]];
  const rows=den.map(([v,q])=>`<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)"><span class="tnum" style="width:56px;font-weight:700;color:var(--text)">${v} lei</span><div style="flex:1;display:flex;align-items:center;gap:8px"><button class="iconbtn" style="width:28px;height:28px">${ic('minus',14)}</button><b class="tnum" style="min-width:22px;text-align:center;color:var(--text)">${q}</b><button class="iconbtn" style="width:28px;height:28px;color:var(--accent)">${ic('plus',14)}</button></div><b class="tnum" style="width:70px;text-align:right;color:var(--text)">${v*q}</b></div>`).join('');
  const counted=den.reduce((a,[v,q])=>a+v*q,0);const expected=1240;const diff=counted-expected;
  return sheet('Reconciliere casă',`<div class="sub" style="margin-bottom:12px">Numără bancnotele; comparăm cu numerarul așteptat.</div>
    <div class="card" style="padding:4px 14px;margin-bottom:14px">${rows}</div>
    <div class="card pad">
      ${infoRow('Numărat',money(counted))}${infoRow('Așteptat (sistem)',money(expected))}
      <div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border)"><b style="color:var(--text)">Diferență</b><b class="tnum" style="color:var(--${diff===0?'green':diff<0?'danger':'amber'})">${diff>0?'+':''}${money(diff)}</b></div>
    </div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="closeModal();toast('Reconciliere salvată · Z-report generat')">Confirmă & generează Z-report</button>`);
}

}

/* ---- offline sync queue ---- */
function mSync(){
  const q=[['12 scanări','în cache · se trimit la reconectare','amber'],['3 vânzări POS','numerar · în coadă','amber'],['1.486 bilete','descărcate pentru offline','green']];
  const rows=q.map(([t,d,c])=>`<div class="row"><div class="chip-i chip-${c==='green'?'green':'amber'}">${ic(c==='green'?'download':'clock',18)}</div><div class="grow"><div class="name">${t}</div><div class="meta">${d}</div></div><span style="color:var(--${c})">${ic(c==='green'?'checkc':'clock',18)}</span></div>`).join('');
  return sheet('Sincronizare offline',`<div class="card pad" style="display:flex;align-items:center;gap:12px;margin-bottom:14px;${S.online?'background:var(--green-tint);border-color:var(--green-border)':'background:var(--amber-tint);border-color:var(--amber-border)'}">
      <span style="color:var(--${S.online?'green':'amber'})">${ic(S.online?'checkc':'alert',22)}</span>

}
