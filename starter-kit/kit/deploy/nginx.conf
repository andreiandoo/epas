# ==========================================================================
# nginx server block for a kit site (Ploi, Forge, plain nginx).
#
# .htaccess is Apache-only — nginx ignores it completely, so without this every
# clean URL 404s and only /index.php works. Paste the location blocks below into
# the site's server {} (on Ploi: Site → Manage → Nginx Configuration), keeping
# the host's own listen/ssl/root/fastcgi lines.
#
# `root` must point at the deployed site root — the directory holding index.php.
# ==========================================================================

# --- Clean URLs -----------------------------------------------------------
# The front controller reads REQUEST_URI, so a plain try_files is enough.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# --- Block direct access to source ---------------------------------------
# The site root also contains its own source: kit/ (the vendored framework),
# includes/, pages/ and site.config.php. Only index.php and api/proxy.php are
# meant to be entry points; everything else must never be requested directly.
location ~ ^/(kit|includes|pages)/ {
    deny all;
    return 404;
}
location ~ ^/(site\.config|routes)\.php$ {
    deny all;
    return 404;
}
location ~ /\.(?!well-known) {          # dotfiles: .git, .deploy-token, .env
    deny all;
    return 404;
}

# --- The two real PHP entry points ---------------------------------------
location = /index.php {
    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;   # match the host's pool
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
}
location = /api/proxy.php {
    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
}
# Any other .php request is not an entry point.
location ~ \.php$ {
    return 404;
}

# --- The deploy webhook ---------------------------------------------------
# Only reachable with the shared secret; the script checks it itself.
location = /_webhook-deploy.php {
    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
}

# --- Static assets --------------------------------------------------------
location ^~ /theme/ {
    expires 7d;
    add_header Cache-Control "public";
}
location ~* \.(?:css|js|svg|png|webp|woff2?|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# --- Error pages ----------------------------------------------------------
error_page 403 /403;
error_page 500 502 /500;
error_page 503 /503;
